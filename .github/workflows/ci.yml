name: CI

on:
  pull_request:
  push:
    branches: [main, "codex/**"]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Lint
        working-directory: web
        run: bun run lint

      - name: TypeScript
        working-directory: web
        run: bun run typecheck

      - name: Creative contract is generated
        working-directory: web
        run: bun run contract:check

      - name: Browser cannot restore provider-direct paths
        working-directory: web
        run: bun run boundary:check

      - name: Tests
        working-directory: web
        run: bun run test

      - name: Production build
        working-directory: web
        env:
          VITE_BASE: /creative/
        run: bun run build

      - name: Install Chromium for visual regression
        working-directory: web
        run: bunx playwright install --with-deps chromium

      - name: Responsive visual regression
        working-directory: web
        run: bun run test:e2e

      - name: License and source gate
        shell: bash
        run: |
          test -s LICENSE
          test -s NOTICE
          test -s UPSTREAM.md
          test -s PATCHES.md
          grep -q "GNU AFFERO GENERAL PUBLIC LICENSE" LICENSE
          grep -q "335467ec0d98aca69df49c285edd56eb00e736e6" UPSTREAM.md
          grep -q "not granted under the software license" NOTICE
          grep -q "PUBLIC_SOURCE_URL" web/src/components/layout/version-release-modal.tsx

  image:
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build immutable test image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: fyjit-creative-canvas:test
          build-args: |
            VITE_BASE=/creative/
            SOURCE_COMMIT=${{ github.sha }}
            SOURCE_URL=https://github.com/${{ github.repository }}/tree/${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify immutable source metadata
        shell: bash
        run: |
          expected_url="https://github.com/${GITHUB_REPOSITORY}/tree/${GITHUB_SHA}"
          docker run --rm --entrypoint sh \
            -e EXPECTED_COMMIT="${GITHUB_SHA}" \
            -e EXPECTED_URL="${expected_url}" \
            fyjit-creative-canvas:test \
            -eu -c 'test "$SOURCE_COMMIT" = "$EXPECTED_COMMIT"; test "$SOURCE_URL" = "$EXPECTED_URL"'

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: fyjit-creative-canvas:test
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
